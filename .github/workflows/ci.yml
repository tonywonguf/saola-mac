name: ci

on:
  push:
    branches: [main]
  pull_request:

# The jobs only read the code. The token cannot write to the repository.
permissions:
  contents: read

jobs:
  guard:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: handy-guard tests
        working-directory: handy-guard
        run: cargo test --locked

  scripts:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: brew install shellcheck && shellcheck -S warning bin/saola
      - name: Settings helper tests
        run: python3 -m unittest discover tests
      - name: saola setup dry run
        run: |
          export HOME=$(mktemp -d)
          mkdir -p "$HOME/hs"
          echo '{"settings": {"post_process_providers": []}}' > "$HOME/hs/settings_store.json"
          SAOLA_HANDY_SETTINGS="$HOME/hs/settings_store.json" bin/saola setup --dry-run | tee out.txt
          grep -q 'would change the Handy cleanup settings' out.txt
          grep -q 'SHA-256 value is 3b41ebe' out.txt
          bin/saola uninstall --dry-run
          bin/saola version

  formula:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Formula from this commit in a local tap
        run: |
          mkdir -p "$RUNNER_TEMP/src"
          git archive --prefix=saola-mac-0.1.0/ -o "$RUNNER_TEMP/src/v0.1.0.tar.gz" HEAD
          sha=$(shasum -a 256 "$RUNNER_TEMP/src/v0.1.0.tar.gz" | cut -d' ' -f1)
          brew tap-new --no-git local/saola
          tap=$(brew --repository)/Library/Taps/local/homebrew-saola
          sed -e "s|^  url .*|  url \"file://$RUNNER_TEMP/src/v0.1.0.tar.gz\"|" \
              -e "s|@SHA256@|$sha|" Formula/saola.rb > "$tap/Formula/saola.rb"
      - name: brew install
        run: HOMEBREW_NO_INSTALL_FROM_API=1 brew install --build-from-source local/saola/saola
      - name: brew test
        run: brew test local/saola/saola
      - name: saola is on PATH and finds its files
        run: |
          saola version
          test -x "$(brew --prefix saola)/libexec/saola-configure-handy"
          test -f "$(brew --prefix saola)/share/saola/rules.example"
          ! grep -q '@LIBEXEC@' "$(brew --prefix saola)/bin/saola"
